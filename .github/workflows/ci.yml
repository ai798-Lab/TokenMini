name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # Match the Node/npm pair used to generate and validate package-lock.json.
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Website tests
        working-directory: website
        run: |
          npm ci
          npm run lint
          npm test
      - name: Tests
        run: |
          ./scripts/test.sh
          python3 -m unittest discover -s tests -p test_download_metrics.py
      - name: Build app bundle
        run: ./scripts/build.sh 0.14.0 23
      - name: Verify bundle
        run: |
          test "$(lipo -archs dist/TokenMini.app/Contents/MacOS/MacPulse)" = "arm64"
          codesign --verify --strict --deep --verbose=2 dist/TokenMini.app
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/TokenMini.app/Contents/Info.plist | grep '^14.0$'
